workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - appstore
      vars:
        EXPO_PUBLIC_DOMAIN: "doctoritup"
      node: v18
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up Expo
        script: |
          npx expo install expo-dev-client
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
          cd ios && pod install && cd ..
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "Com.owlkimmy.doctoritup" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Build iOS
        script: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          echo "export FORCE_BUNDLING=1" >> ios/.xcode.env.local
          echo "export CI=1" >> ios/.xcode.env.local
          cat ios/.xcode.env.local
          
          # Create symlink so node is findable by Xcode
          ln -sf $(which node) /usr/local/bin/node || true
          
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
