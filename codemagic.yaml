workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - appstore
      vars:
        EXPO_PUBLIC_DOMAIN: "doctoritup"
        NODE_OPTIONS: "--max-old-space-size=4096"
      node: v18
      xcode: 16.2
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up Expo
        script: |
          npx expo install expo-dev-client
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "Com.owlkimmy.doctoritup" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Build iOS
        script: |
          # Get the real node path (resolve any symlinks)
          NODE_REAL_PATH=$(python3 -c "import os; print(os.path.realpath('$(which node)'))")
          echo "Real Node path: $NODE_REAL_PATH"
          
          # Set up Xcode environment
          echo "export NODE_BINARY=$NODE_REAL_PATH" > ios/.xcode.env.local
          echo "export ENTRY_FILE=node_modules/expo-router/entry.js" >> ios/.xcode.env.local
          cat ios/.xcode.env.local
          
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE, scheme: $SCHEME"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
