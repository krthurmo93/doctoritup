workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore
      vars:
        EXPO_PUBLIC_DOMAIN: "doctoritup"
        BUNDLE_ID: "Com.owlkimmy.doctoritup"
      node: v18
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Set up Expo
        script: |
          npx expo install expo-dev-client
      - name: Prebuild iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "Com.owlkimmy.doctoritup" --type IOS_APP_STORE --create
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/doctoritup.xcworkspace" \
            --scheme "doctoritup"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: environment
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
